<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bodega Tablado</title>
  <meta name="theme-color" content="#2c5a4d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bodega">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="title-row">
        <h1>Bodega Tablado</h1>
        <div class="acciones">
          <button class="btn primary" id="btn-nuevo" type="button" hidden>+ Añadir vino</button>
          <button class="btn ghost" id="btn-menu" type="button" aria-haspopup="true" aria-expanded="false" hidden>⋯</button>
          <div class="menu" id="menu" hidden>
            <button type="button" id="btn-exportar">Exportar copia (JSON)</button>
            <button type="button" id="btn-importar">Importar copia (JSON)</button>
            <button type="button" id="btn-salir">Cerrar sesión</button>
          </div>
          <input type="file" id="file-importar" accept="application/json" hidden>
        </div>
      </div>
      <p class="aviso" id="aviso-demo" hidden>Modo demo: los cambios se guardan solo en este navegador. Conecta Supabase en <code>config.js</code> para sincronizar móvil y ordenador.</p>
      <ul class="tally" id="tally" aria-label="Resumen"></ul>
    </header>

    <section class="login" id="login" hidden>
      <h2>Entrar</h2>
      <p>Escribe tu correo y te enviaremos un enlace para entrar. No hace falta contraseña.</p>
      <form id="form-login">
        <input type="email" id="login-email" required placeholder="tu@correo.com" autocomplete="email">
        <button class="btn primary" type="submit">Enviar enlace</button>
      </form>
      <p class="estado" id="login-estado" role="status"></p>
    </section>

    <main id="app" hidden>
      <div class="vacio" id="vacio" hidden>
        <p>Tu bodega está vacía.</p>
        <button class="btn primary" type="button" id="btn-cargar-iniciales">Cargar mis 37 vinos del artefacto</button>
      </div>

      <div class="controles">
        <input type="search" id="buscar" placeholder="Buscar por vino, bodega, uva, país…" aria-label="Buscar">
        <nav class="filters" id="filtros" aria-label="Filtrar">
          <button class="chip" type="button" data-filter="todo" aria-pressed="true">Todo</button>
          <button class="chip" type="button" data-filter="tinto" aria-pressed="false">Tintos</button>
          <button class="chip" type="button" data-filter="blanco" aria-pressed="false">Blancos</button>
          <button class="chip" type="button" data-filter="espumoso" aria-pressed="false">Espumosos</button>
          <button class="chip" type="button" data-filter="rosado" aria-pressed="false">Rosados</button>
          <button class="chip" type="button" data-filter="ya" aria-pressed="false">Beber ya</button>
          <button class="chip" type="button" data-filter="guardar" aria-pressed="false">Guardar</button>
          <button class="chip" type="button" data-filter="agotados" aria-pressed="false">Agotados</button>
        </nav>
        <label class="orden">Ordenar
          <select id="orden">
            <option value="tipo">Por tipo</option>
            <option value="urgencia">Por urgencia</option>
            <option value="anada">Por añada</option>
            <option value="nombre">Por nombre</option>
          </select>
        </label>
      </div>

      <div id="lista"></div>
    </main>
  </div>

  <dialog id="dlg">
    <form id="form-vino" method="dialog">
      <h2 id="dlg-titulo">Vino</h2>
      <div class="grid">
        <label class="full">Nombre del vino<input name="nombre" required></label>
        <label>Bodega<input name="bodega"></label>
        <label>Tipo
          <select name="tipo" required>
            <option value="tinto">Tinto</option>
            <option value="blanco">Blanco</option>
            <option value="espumoso">Espumoso</option>
            <option value="rosado">Rosado</option>
            <option value="otro">Otro</option>
          </select>
        </label>
        <label>Añada<input name="anada" type="number" inputmode="numeric" min="1800" max="2100" placeholder="Sin añada"></label>
        <label>Botellas<input name="botellas" type="number" inputmode="numeric" min="0" value="1" required></label>
        <label>Denominación<input name="denominacion"></label>
        <label>País<input name="pais"></label>
        <label class="full">Uvas<input name="uvas"></label>
        <label>Cuándo beber
          <select name="estado">
            <option value="">Sin indicar</option>
            <option value="urg">Urgente</option>
            <option value="ya">Beber ya</option>
            <option value="punto">En su punto</option>
            <option value="guardar">Guardar</option>
          </select>
        </label>
        <label>Ventana<input name="ventana" placeholder="p. ej. hasta 2030"></label>
        <label class="full">Puntuación<input name="puntuacion"></label>
        <label class="full">Nota de cata<textarea name="cata" rows="3"></textarea></label>
        <label class="full">Notas<textarea name="notas" rows="2"></textarea></label>
      </div>
      <div class="dlg-acciones">
        <button class="btn danger" type="button" id="btn-borrar">Borrar</button>
        <span class="sp"></span>
        <button class="btn ghost" type="button" id="btn-cancelar">Cancelar</button>
        <button class="btn primary" type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
